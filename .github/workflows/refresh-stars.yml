name: Refresh GitHub Stars Dashboard

on:
  schedule:
    # Runs every day at 01:20 UTC, which is 09:20 in China Standard Time.
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh-stars-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh starred repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python refresh_stars.py

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll

          python -c "import json, pathlib, shutil; root=pathlib.Path('.'); site=pathlib.Path('_site'); data=json.loads(pathlib.Path('.stars-pages.json').read_text(encoding='utf-8')); [shutil.copytree(root / slug, site / slug, dirs_exist_ok=True) for slug in data.get('slugs', [])]"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
